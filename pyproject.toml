[project]
name = "judo-tournament"
version = "0.1.0"
description = "A Streamlit web app to manage small judo tournaments"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.136.3",
    "notebook>=7.5.5",
    "numpy>=2.4.1",
    "pandas>=2.2.0",
    "pyjwt>=2.13.0",
    "python-multipart>=0.0.29",
    "reportlab>=4.5.1",
    "sqlalchemy>=2.0.46",
    "sqlmodel>=0.0.31",
    "streamlit>=1.53.1",
    "uvicorn[standard]>=0.48.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/backend", "src/app", "src/api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
